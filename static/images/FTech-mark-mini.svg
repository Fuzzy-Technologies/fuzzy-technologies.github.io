<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Fuzzy Technologies compact mark</title>
  <defs>
    <linearGradient id="ft-f" x1="8" y1="12" x2="40" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#edf7fa"/>
