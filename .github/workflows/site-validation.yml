name: Validate site navigation

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  site-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: production-domain
            site_url: ''
          - name: custom-domain
            site_url: https://www.example.test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build the selected HTTPS origin
        env:
          SITE_URL: ${{ matrix.site_url }}
          BUILD_NAME: ${{ matrix.name }}
        run: |
          python - <<'PY'
          """Select the configured production origin or an independent HTTPS fixture."""

          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          site_url = os.environ["SITE_URL"]

          if os.environ["BUILD_NAME"] == "production-domain":
              cname_path = Path("CNAME")
              hostname = cname_path.read_text(encoding="utf-8").strip().lower() if cname_path.is_file() else "fuzzy-technologies.github.io"
              site_url = "https://" + hostname

          origin = urlsplit(site_url)
          assert origin.scheme == "https" and origin.hostname and site_url == "https://" + origin.hostname, "Expected a single HTTPS hostname without paths, ports, or extra lines."
          config_path = Path("_config.yml")
          config_text = config_path.read_text(encoding="utf-8")
          assert "url: null" in config_text, "The production origin must come from Pages metadata."
          config_path.write_text(config_text.replace("url: null", "url: " + json.dumps(site_url), 1), encoding="utf-8")

          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              env_file.write("SITE_URL=" + site_url + "\n")
          PY
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check locale navigation and all internal links
        run: |
          python scripts/check_site_navigation.py _site --site-url "$SITE_URL"
          python scripts/check_site_links.py _site --site-url "$SITE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: site-navigation-preview-${{ matrix.name }}
          retention-days: 3
          path: |
            _site/**/*.html
            _site/static/style.css
            _site/static/main.js
