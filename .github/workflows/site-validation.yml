name: Validate site navigation

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  site-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/check_site_navigation.py _site
      - uses: actions/upload-artifact@v4
        with:
          name: site-navigation-preview
          retention-days: 3
          path: |
            _site/**/*.html
            _site/static/style.css
            _site/static/main.js
